name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      - name: Configure Capacitor Android Platform
        run: |
          npx @capacitor/cli init "Dynamic Island Android 16" "com.android.dynamicisland" --web-dir dist || true
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Configure Gradle Settings & Fix Duplicates
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle || true
          echo "configurations.all {" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
